name: Validate workspace
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate current workspace
        run: node scripts/validate-workspace.mjs
      - name: Check scripts and build
        run: |
          node --check scripts/create-project.mjs
          node --check scripts/validate-workspace.mjs
          bash -n scripts/build-pages.sh
          bash -n scripts/build-preview.sh
          bash -n scripts/create-release-tags.sh
          bash scripts/build-pages.sh
      - name: Test project creation, production build and hosted preview build
        run: |
          temp_dir="$(mktemp -d)"
          cp -R projects starter portfolio creator shared assets content images scripts index.html "$temp_dir/"
          cd "$temp_dir"
          node scripts/create-project.mjs sample-project "Sample Project" "Temporary validation fixture" learning
          mkdir -p projects/sample-project/functions/api
          printf '%s' 'export function onRequest() { return new Response("ok"); }' > projects/sample-project/functions/api/health.js
          git init -q
          git config user.name "Workspace CI"
          git config user.email "ci@example.invalid"
          git add .
          git commit -m "test fixture"
          git tag project/sample-project/v0.1.0
          node --input-type=module -e 'import fs from "node:fs"; const file="portfolio/portfolio.json"; const data=JSON.parse(fs.readFileSync(file,"utf8")); data.projects=[{project_id:"sample-project",version:"0.1.0",tag:"project/sample-project/v0.1.0",title:"Sample Project",summary:"Temporary fixture",category:"learning"}]; fs.writeFileSync(file,JSON.stringify(data,null,2)+"\n");'
          node scripts/validate-workspace.mjs
          bash scripts/build-pages.sh
          test -s _site/projects/sample-project/index.html
          test -s _site/projects/sample-project/project.json
          bash scripts/build-preview.sh
          test -s _preview/index.html
          test -s _preview/projects/sample-project/index.html
          test -s _preview/functions/projects/sample-project/api/health.js
          jq -e '.include | index("/projects/*/api/*")' _preview/_routes.json >/dev/null
      - name: Test immutable, idempotent and publish release automation
        run: |
          workspace_root="$GITHUB_WORKSPACE"
          temp_dir="$(mktemp -d)"
          cd "$temp_dir"
          git init -q
          git config user.name "Workspace CI"
          git config user.email "ci@example.invalid"
          mkdir -p projects/sample-project portfolio
          printf '{"id":"sample-project","current_version":"1.2.3","title":"Sample","summary":"Test","category":"learning"}\n' > projects/sample-project/project.json
          printf '{"schema_version":1,"projects":[]}\n' > portfolio/portfolio.json
          git add .
          git commit -m "fixture project"
          before="$(git rev-parse HEAD)"
          mkdir -p releases/requests
          printf '{"project_id":"sample-project","version":"1.2.3"}\n' > releases/requests/sample-project-v1.2.3.json
          git add .
          git commit -m "request fixture release"
          after="$(git rev-parse HEAD)"
          git init --bare -q "$temp_dir/remote.git"
          git remote add origin "$temp_dir/remote.git"
          git push -q origin HEAD:main
          GITHUB_EVENT_BEFORE="$before" GITHUB_SHA="$after" bash "$workspace_root/scripts/create-release-tags.sh"
          git --git-dir="$temp_dir/remote.git" show-ref --verify --quiet refs/tags/project/sample-project/v1.2.3
          GITHUB_EVENT_BEFORE="$before" GITHUB_SHA="$after" bash "$workspace_root/scripts/create-release-tags.sh"
          mkdir -p projects/public-project
          printf '{"id":"public-project","current_version":"0.4.0","title":"Public Sample","summary":"Published fixture","category":"learning"}\n' > projects/public-project/project.json
          git add .
          git commit -m "add public fixture project"
          before_public="$(git rev-parse HEAD)"
          printf '{"project_id":"public-project","version":"0.4.0","publish":true}\n' > releases/requests/public-project-v0.4.0.json
          git add .
          git commit -m "request public fixture release"
          after_public="$(git rev-parse HEAD)"
          git push -q origin HEAD:main
          GITHUB_EVENT_BEFORE="$before_public" GITHUB_SHA="$after_public" bash "$workspace_root/scripts/create-release-tags.sh"
          git --git-dir="$temp_dir/remote.git" show-ref --verify --quiet refs/tags/project/public-project/v0.4.0
          git --git-dir="$temp_dir/remote.git" show main:portfolio/portfolio.json | jq -e '.projects[] | select(.project_id == "public-project" and .tag == "project/public-project/v0.4.0")' >/dev/null
          GITHUB_EVENT_BEFORE="$before_public" GITHUB_SHA="$after_public" bash "$workspace_root/scripts/create-release-tags.sh"
          printf 'retry fixture\n' > retry.txt
          git add retry.txt
          git commit -m "later commit"
          later="$(git rev-parse HEAD)"
          if GITHUB_EVENT_BEFORE="$before_public" GITHUB_SHA="$later" bash "$workspace_root/scripts/create-release-tags.sh"; then
            echo "Expected an existing tag on a different commit to be rejected."
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: workspace-pages-preview-${{ github.sha }}
          path: _site
          retention-days: 14
      - name: Check starter files
        run: |
          test -s starter/static-site/index.html
          test -s starter/static-site/styles.css
          test -s starter/static-site/app.js
          test -s projects/_template/project.json
          test -s portfolio/portfolio.json
