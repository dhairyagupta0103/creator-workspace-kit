name: Validate workspace
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate current workspace
        run: node scripts/validate-workspace.mjs
      - name: Check scripts and build
        run: |
          node --check scripts/create-project.mjs
          node --check scripts/validate-workspace.mjs
          bash -n scripts/build-pages.sh
          bash scripts/build-pages.sh
      - name: Test project creation and release assembly
        run: |
          temp_dir="$(mktemp -d)"
          cp -R projects starter portfolio creator shared assets content images scripts index.html "$temp_dir/"
          cd "$temp_dir"
          node scripts/create-project.mjs sample-project "Sample Project" "Temporary validation fixture" learning
          git init -q
          git config user.name "Workspace CI"
          git config user.email "ci@example.invalid"
          git add .
          git commit -m "test fixture"
          git tag project/sample-project/v0.1.0
          node --input-type=module -e 'import fs from "node:fs"; const file="portfolio/portfolio.json"; const data=JSON.parse(fs.readFileSync(file,"utf8")); data.projects=[{project_id:"sample-project",version:"0.1.0",tag:"project/sample-project/v0.1.0",title:"Sample Project",summary:"Temporary fixture",category:"learning"}]; fs.writeFileSync(file,JSON.stringify(data,null,2)+"\n");'
          node scripts/validate-workspace.mjs
          bash scripts/build-pages.sh
          test -s _site/projects/sample-project/index.html
          test -s _site/projects/sample-project/project.json
      - uses: actions/upload-artifact@v4
        with:
          name: workspace-pages-preview-${{ github.sha }}
          path: _site
          retention-days: 14
      - name: Check starter files
        run: |
          test -s starter/static-site/index.html
          test -s starter/static-site/styles.css
          test -s starter/static-site/app.js
          test -s projects/_template/project.json
          test -s portfolio/portfolio.json
